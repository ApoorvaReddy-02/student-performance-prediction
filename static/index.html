<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Performance Predictor</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;display:flex;justify-content:center;padding:30px}
.card{background:#fff;padding:24px;border-radius:12px;max-width:420px;width:100%;box-shadow:0 2px 10px #0002}
label{display:block;margin-top:12px;font-weight:600;font-size:14px}
input{width:100%;padding:8px;margin-top:4px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}
button{margin-top:18px;width:100%;padding:10px;background:#3b5bdb;color:#fff;border:0;border-radius:6px;font-size:16px;cursor:pointer}
#out{margin-top:16px;font-size:18px;font-weight:700}
</style></head><body><div class="card">
<h2>Student Performance Predictor</h2>
<label for="study_hours">Study hours per day</label><input id="study_hours" type="number" step="0.1" value="5">
<label for="attendance">Attendance %</label><input id="attendance" type="number" step="0.1" value="80">
<label for="previous_score">Previous score</label><input id="previous_score" type="number" step="0.1" value="65">
<label for="assignments_done">Assignments done (0-10)</label><input id="assignments_done" type="number" value="7">
<label for="sleep_hours">Sleep hours</label><input id="sleep_hours" type="number" step="0.1" value="7">
<button onclick="go()">Predict</button><div id="out"></div></div>
<script>
async function go(){
 const ids=["study_hours","attendance","previous_score","assignments_done","sleep_hours"];
 const body={};ids.forEach(i=>body[i]=Number(document.getElementById(i).value));
 const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const o=document.getElementById("out");
 if(!r.ok){o.textContent="Invalid input";return}
 const d=await r.json();
 o.textContent="Predicted: "+d.prediction+" ("+Math.round(Math.max(...Object.values(d.probabilities))*100)+"% confidence)";
}
</script></body></html>
